<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height:100vh;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .quote-box{
            background: #ffff;
            padding:40px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width:90px;
            text-align:center;
        }
        h2{
            color:#333;
            margin-bottom:20px;
            font-size: 1.5rem;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
